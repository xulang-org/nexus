<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Nexus WebGL</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <div class="shell">
    <header class="hud">
      <div class="hud-left">
        <div class="brand">
          <span class="brand-badge">NEXUS</span>
          <span class="brand-title">WebGL</span>
        </div>
        <div class="scene-switch" role="group" aria-label="场景模式">
          <button type="button" class="mode-btn is-active" data-scene="3d" aria-pressed="true">3D 模型</button>
          <button type="button" class="mode-btn" data-scene="2d" aria-pressed="false">2D 竞技场</button>
        </div>
      </div>
      <div class="hud-center">
        <span id="readout" class="stat-pill">视角准备中</span>
        <span id="fps" class="stat-pill">0 FPS</span>
        <span id="memory" class="stat-pill">-- KB</span>
      </div>
      <div class="hud-right">
        <span id="status" class="status-text">正在加载 Nexus…</span>
        <button type="button" id="reset-btn" class="reset-btn" disabled>复位 (R)</button>
      </div>
    </header>
    <main class="stage">
      <canvas id="arena" tabindex="0" aria-label="Nexus WebGL Canvas"></canvas>
      <div id="hints" class="hints-bar">左键拖拽旋转 · Shift+拖拽或右键平移 · 滚轮缩放 · 双击或按 R 复位</div>
      <div id="overlay" class="overlay" hidden>
        <p id="overlay-text"></p>
      </div>
    </main>
  </div>
  <script src="./runtime/canvas.js"></script>
  <script src="./runtime/wasm.js"></script>
  <script src="./runtime/demo.js"></script>
  <script type="module" src="./app.js"></script>
</body>
</html>
